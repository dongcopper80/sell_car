name: otochinhchu_app
description: OtoChinhChu mobile app — mua bán ô tô chính chủ (dùng OtoChinhChu API).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0                    # HTTP client gọi OtoChinhChu API
  shared_preferences: ^2.2.0     # Lưu token + user
  intl: ^0.19.0                  # Format tiền tệ / ngày
  cached_network_image: ^3.3.1   # Ảnh tin đăng (URL ngoài + CDN)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
